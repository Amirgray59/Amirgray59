<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Simple animated Backend and AI developer illustration">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Simple backend background: API, database, server and code -->
  <g fill="none" stroke="#64748b" stroke-width="2" opacity="0.28">
    <!-- API endpoint -->
    <rect x="48" y="62" width="112" height="54" rx="12"/>
    <path d="M68 83h70M68 96h42"/>
    <circle cx="143" cy="96" r="4" fill="#22d3ee" stroke="none"/>

    <!-- Database -->
    <ellipse cx="690" cy="73" rx="48" ry="15"/>
    <path d="M642 73v54c0 8 21 15 48 15s48-7 48-15V73"/>
    <path d="M642 100c0 8 21 15 48 15s48-7 48-15"/>

    <!-- Server stack -->
    <rect x="54" y="260" width="112" height="30" rx="8"/>
    <rect x="54" y="301" width="112" height="30" rx="8"/>
    <circle cx="72" cy="275" r="4" fill="#8b5cf6" stroke="none"/>
    <circle cx="72" cy="316" r="4" fill="#34d399" stroke="none"/>
    <path d="M88 275h55M88 316h55"/>

    <!-- Code brackets -->
    <path d="M676 260l-25 25 25 25M724 260l25 25-25 25M705 254l-10 62" stroke="#8b5cf6"/>

    <!-- subtle connections -->
    <path d="M160 89h80M560 89h82M166 275h74M560 285h91" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Animated backend request path -->
  <g fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.35">
    <path d="M160 89 C220 89 225 200 300 200" stroke-dasharray="4 9">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M500 200 C575 200 580 89 642 89" stroke-dasharray="4 9">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- AI neural network -->
  <g stroke="#374151" stroke-width="2">
    <line x1="150" y1="135" x2="300" y2="200"/>
    <line x1="150" y1="265" x2="300" y2="200"/>
    <line x1="300" y1="200" x2="500" y2="200"/>
    <line x1="500" y1="200" x2="650" y2="135"/>
    <line x1="500" y1="200" x2="650" y2="265"/>
  </g>

  <!-- flowing AI data -->
  <g fill="#6366f1" filter="url(#glow)">
    <circle r="5">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 150 135 L 300 200 L 500 200 L 650 135"/>
    </circle>
    <circle r="5">
      <animateMotion dur="4s" repeatCount="indefinite" path="M 150 265 L 300 200 L 500 200 L 650 265"/>
    </circle>
  </g>

  <!-- network nodes -->
  <g fill="#1f2937" stroke="#6366f1" stroke-width="3">
    <circle cx="150" cy="135" r="10"/>
    <circle cx="150" cy="265" r="10"/>
    <circle cx="300" cy="200" r="14" fill="#312e81"/>
    <circle cx="500" cy="200" r="14" fill="#312e81"/>
    <circle cx="650" cy="135" r="10"/>
    <circle cx="650" cy="265" r="10"/>
  </g>

  <!-- small pulse indicators -->
  <g fill="#22d3ee">
    <circle cx="240" cy="200" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="200" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="400" y="360" fill="#9ca3af" font-family="sans-serif" font-size="16" text-anchor="middle" letter-spacing="1">
    BACKEND • AI • INFRASTRUCTURE
  </text>
</svg>
